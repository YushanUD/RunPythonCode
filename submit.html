<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Your Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c232e;
    --muted: #5b6472;
    --panel: #ffffff;
    --bg: #f5f7fa;
    --border: #dde2e8;
    --accent: #2e3d52;
    --accent-hover: #253244;
    --success: #1e4d2b;
    --success-bg: #eaf3ec;
    --error: #9c2b23;
    --error-bg: #fbebe9;
    --code-bg: #f8f9fb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 6px 2px;
  }

  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.25;
    margin: 0 0 28px 2px;
    color: var(--ink);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .panel-header {
    background: var(--accent);
    color: #ffffff;
    padding: 16px 24px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
  }

  form {
    padding: 28px 24px 24px;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 18px;
  }

  @media (max-width: 520px) {
    .row { grid-template-columns: 1fr; gap: 18px; }
  }

  .field { margin-bottom: 18px; }
  .row .field { margin-bottom: 0; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="email"] {
    width: 100%;
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(46, 61, 82, 0.12);
  }

  textarea {
    width: 100%;
    min-height: 260px;
    padding: 14px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
    tab-size: 4;
  }

  textarea::placeholder { color: #9aa3ae; }

  .hint {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
  }

  button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover:not(:disabled) { background: var(--accent-hover); }

  button:disabled {
    background: #a9b2bd;
    cursor: not-allowed;
  }

  .status {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.5;
  }

  .status.show { display: block; }

  .status.success {
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid #cfe3d4;
  }

  .status.error {
    background: var(--error-bg);
    color: var(--error);
    border: 1px solid #f0cdc8;
  }

  footer {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Data Analysis with Python</p>
  <h1>Submit your code for grading</h1>

  <div class="panel">
    <div class="panel-header">Assignment submission</div>
    <form id="submitForm">
      <div class="row">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" name="studentId" required autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="code">Your code</label>
        <textarea id="code" name="code" required placeholder="Paste the code from your notebook here..."></textarea>
        <p class="hint">Copy the cells from your notebook (Edit &rarr; Select All, then Copy) and paste them here.</p>
      </div>

      <button type="submit" id="submitBtn">Submit assignment</button>

      <div class="status" id="statusBox"></div>
    </form>
  </div>

  <footer>Submissions are recorded with a timestamp for grading.</footer>
</div>

<script>
  // ── Set this to your Google Apps Script Web App URL ──
  // (see the deployment instructions provided alongside this file)
  const SCRIPT_URL = "https://script.google.com/a/macros/udel.edu/s/AKfycby5EFuicxN4zAS0fAGO2sKcaO9Cw-oroyeF_P45WB_KthPOdZ7pyXuxIQvDIY_US0Vu/exec";

  const form = document.getElementById('submitForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusBox = document.getElementById('statusBox');

  function showStatus(kind, message) {
    statusBox.textContent = message;
    statusBox.className = 'status show ' + kind;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    if (SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
      showStatus('error', 'This form is not connected to a backend yet. (Instructor: add your Apps Script URL in submit.html.)');
      return;
    }

    const payload = {
      name: document.getElementById('name').value.trim(),
      studentId: document.getElementById('studentId').value.trim(),
      email: document.getElementById('email').value.trim(),
      code: document.getElementById('code').value
    };

    if (!payload.name || !payload.studentId || !payload.email || !payload.code) {
      showStatus('error', 'Please fill in every field before submitting.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    statusBox.className = 'status';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight
        body: JSON.stringify(payload)
      });

      const result = await res.json();

      if (result.status === 'success') {
        showStatus('success', 'Submitted! You can close this page or submit another assignment.');
        form.reset();
      } else {
        showStatus('error', 'Something went wrong on the server: ' + (result.message || 'unknown error'));
      }
    } catch (err) {
      showStatus('error', 'Could not reach the submission server. Check your connection and try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit assignment';
    }
  });
</script>

</body>
</html>
